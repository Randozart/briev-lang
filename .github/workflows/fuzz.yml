name: Fuzz

# 2026-11-09: coverage-guided fuzzing in an isolated `fuzz/` workspace.
# Two lanes:
#   smoke   — bounded, blocking, runs on PRs. Targets that must pass today.
#   explore — long, non-blocking, nightly + manual dispatch. Includes the
#             interpreter target, which currently reproduces known OPEN tuple
#             defects (BUGS.md 2026-11-09). Findings are uploaded, never hidden.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of fuzzing per shard
        default: "300"

jobs:
  smoke:
    name: Fuzz smoke (blocking)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2

      # 2026-11-09: cargo-fuzz's default --target is baked in at build time
      # (current_platform::CURRENT_PLATFORM). A prebuilt cargo-fuzz fetched by
      # install-action can default to *-musl, where ASan fails with "sanitizer
      # is incompatible with statically linked libc". Always pass the runtime
      # host triple explicitly so CI links the glibc ASan supports.
      - name: Resolve host target triple
        run: |
          echo "FUZZ_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Build fuzz targets
        run: cargo fuzz build --target "$FUZZ_TARGET"

      - name: Seed corpora
        run: |
          mkdir -p fuzz/corpus/frontend fuzz/corpus/arithmetic
          cp -n fuzz/seeds/frontend/* fuzz/corpus/frontend/ || true
          cp -n fuzz/seeds/arithmetic/* fuzz/corpus/arithmetic/ || true

      - name: Fuzz frontend (30s)
        run: cargo fuzz run --target "$FUZZ_TARGET" frontend fuzz/corpus/frontend -- -max_total_time=30 -print_final_stats=1

      - name: Fuzz arithmetic oracle (60s)
        run: cargo fuzz run --target "$FUZZ_TARGET" arithmetic fuzz/corpus/arithmetic -- -max_total_time=60 -print_final_stats=1

      - name: Upload smoke findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  explore:
    name: Fuzz explore (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [frontend, arithmetic, interpreter]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2

      # See the smoke job: pass the runtime host triple so ASan links glibc,
      # not a prebuilt cargo-fuzz's baked-in default.
      - name: Resolve host target triple
        run: |
          echo "FUZZ_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}

      - name: Build fuzz target
        run: cargo fuzz build --target "$FUZZ_TARGET" ${{ matrix.target }}

      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Seed corpora
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp -n fuzz/seeds/${{ matrix.target }}/* fuzz/corpus/${{ matrix.target }}/ || true

      - name: Fuzz
        id: run
        continue-on-error: true
        run: |
          cargo fuzz run --target "$FUZZ_TARGET" ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.seconds || 300 }} \
            -fork=$(nproc) -print_final_stats=1

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

      # The interpreter target reproduces known OPEN defects; keep the job
      # green so a red nightly means a *new* finding, not a standing one.
      - name: Note standing findings
        if: steps.run.outcome == 'failure'
        run: |
          echo "::warning::${{ matrix.target }} produced a finding — see uploaded artifacts."
