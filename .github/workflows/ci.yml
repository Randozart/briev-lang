name: CI

# 2026-11-15: unrelated suites must survive a library failure. Only release
# consumers depend on the compiler build; Default gates aggregates every
# required result, including skipped/cancelled jobs. Preserve that check name
# until branch protection is deliberately migrated to an equivalent aggregate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  gate-controls:
    name: Gate infrastructure controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Gate and CI controls
        run: |
          mkdir -p target/ci-evidence
          git rev-parse HEAD > target/ci-evidence/revision.txt
          python3 --version > target/ci-evidence/python-version.txt
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v 2>&1 | tee target/ci-evidence/controls.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-gate-controls-${{ github.run_attempt }}
          path: target/ci-evidence/
          if-no-files-found: error

  verifier:
    name: Required verifier and Z3 regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-tools
        with:
          native: "false"
          nextest: "true"
          cache-key: verifier
      - name: Required verifier and Z3 regressions
        # 2026-11-15: ignored Z3 regressions need explicit required execution.
        # The shared gate also checks conflict markers and retains named results.
        # Retire this invocation only when another required lane accounts for them.
        run: bash scripts/gate.sh verifier --runner nextest 2>&1 | tee target/ci-evidence/verifier.log
      - name: Preserve verifier gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-gate-evidence-${{ github.run_attempt }}
          path: |
            target/gate-results/
            target/ci-evidence/
          if-no-files-found: error

  library:
    name: Library tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-tools
        with:
          nextest: "true"
      - name: Library tests
        # nextest runs test binaries concurrently (cargo test serializes them);
        # -j 4 keeps clang/brievc-spawning tests from starving each other.
        run: cargo nextest run --lib -j 4 2>&1 | tee target/ci-evidence/library.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-library-${{ github.run_attempt }}
          path: target/ci-evidence/
          if-no-files-found: error

  compiler:
    name: Release compiler build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      # 2026-11-15: use the producing attempt's artifact on downstream-only
      # reruns, preserving prior evidence; retire if Actions supplies this identity.
      artifact: ${{ steps.bundle.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-tools
        with:
          cache-key: release
      - name: Build release compiler
        run: cargo build --release --bin brievc 2>&1 | tee target/ci-evidence/build.log
      - name: Package same-revision compiler and runtime archives
        id: bundle
        run: |
          bash scripts/ci_compiler_artifact.sh pack
          echo "artifact=ci-compiler-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: target/ci-compiler.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-compiler-build-${{ github.run_attempt }}
          path: target/ci-evidence/
          if-no-files-found: error

  workspace:
    name: Workspace tests
    needs: compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-tools
        with:
          nextest: "true"
      - uses: ./.github/actions/use-ci-compiler
        with:
          artifact: ${{ needs.compiler.outputs.artifact }}
      - name: All-target tests
        run: cargo nextest run --all -j 4 2>&1 | tee target/ci-evidence/workspace.log
      - name: Binary tests
        run: cargo test --bin brievc 2>&1 | tee target/ci-evidence/binary.log
      - name: Tier-1 end-to-end fixtures
        run: cargo test --test daily_use_smoke 2>&1 | tee target/ci-evidence/tier1.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-workspace-${{ github.run_attempt }}
          path: target/ci-evidence/
          if-no-files-found: error
      - name: Preserve deterministic simulation counterexample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-transition-failure-${{ github.run_attempt }}
          path: target/simulation-failure/
          if-no-files-found: ignore

  native:
    name: Native (${{ matrix.check }})
    needs: compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [effect-shape, targets, accel, determinism, parity]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-tools
        with:
          cache-key: release-consumers
      - uses: ./.github/actions/use-ci-compiler
        with:
          artifact: ${{ needs.compiler.outputs.artifact }}
      - name: Native gate
        env:
          CHECK: ${{ matrix.check }}
        run: bash scripts/ci_native.sh "$CHECK" 2>&1 | tee "target/ci-evidence/$CHECK.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-native-${{ matrix.check }}-${{ github.run_attempt }}
          path: |
            target/ci-evidence/
            benchmarks/parity/_out/
            /tmp/tier2-aarch64/
            /tmp/tier2-riscv64/
          if-no-files-found: error

  browser:
    name: Browser gates
    needs: compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-tools
        with:
          cache-key: release-consumers
      - uses: ./.github/actions/use-ci-compiler
        with:
          artifact: ${{ needs.compiler.outputs.artifact }}
      - name: Browser heap and collection snapshot gates
        run: |
          node --version > target/ci-evidence/node-version.txt
          node tests/web_host_transport.mjs 2>&1 | tee target/ci-evidence/web-host.log
          node tests/web_heap.mjs 2>&1 | tee target/ci-evidence/web-heap.log
          ./target/release/brievc build tests/fixtures/collection_snapshot.rbv --split --out /tmp/collection_snapshot 2>&1 | tee target/ci-evidence/web-build.log
          node tests/web_collection_snapshot.mjs /tmp/collection_snapshot/collection_snapshot.wasm 2>&1 | tee target/ci-evidence/web-snapshot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-browser-${{ github.run_attempt }}
          path: |
            target/ci-evidence/
            /tmp/collection_snapshot/
          if-no-files-found: error

  contracts:
    name: Contract census (warn-policy diagnostic)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-tools
      - name: Contract census (warn-policy diagnostic)
        run: bash scripts/contract_census.sh target/ci-evidence/contract-census.log 2>&1 | tee target/ci-evidence/census-console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-contracts-${{ github.run_attempt }}
          path: target/ci-evidence/
          if-no-files-found: error

  quarantine:
    name: Quarantined tests (non-blocking)
    needs: compiler
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-tools
      - uses: ./.github/actions/use-ci-compiler
        with:
          artifact: ${{ needs.compiler.outputs.artifact }}
      - name: Quarantined tests (non-blocking)
        run: timeout 600s cargo test --all -- --ignored --test-threads=1 2>&1 | tee target/ci-evidence/quarantine.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-quarantine-${{ github.run_attempt }}
          path: target/ci-evidence/
          if-no-files-found: ignore

  counsel:
    name: Counsel static verification (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-tools
        with:
          cache-key: counsel
      - name: Counsel static verification (src/ — non-blocking)
        # Clones counsel-crate, builds counsel-check (static half), runs it over
        # the entire src/ tree. Non-blocking: proven/unproven/skipped are logged;
        # only a Violated result causes a non-zero exit. counsel-crate:
        # https://github.com/Randozart/counsel
        run: |
          git clone --depth 1 https://github.com/Randozart/counsel.git /tmp/counsel-crate
          (cd /tmp/counsel-crate && cargo build --release --features static --bin counsel-check)
          /tmp/counsel-crate/target/release/counsel-check \
            --format human \
            src/ 2>&1 \
            | tee /tmp/counsel-check.log
      - name: Counsel verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counsel-check-report-${{ github.run_attempt }}
          path: /tmp/counsel-check.log
          if-no-files-found: ignore

  gates:
    name: Default gates
    if: always()
    needs: [gate-controls, verifier, library, compiler, workspace, native, browser, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every required job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci_summary.py
      - name: Preserve required-job results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-required-jobs-${{ github.run_attempt }}
          path: target/ci-evidence/required-jobs.json
          if-no-files-found: error
