name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: Default gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM + SPIR-V tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm build-essential spirv-tools

      - name: Prepare test directories
        run: mkdir -p /tmp/opencode

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: No conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- ':!target'; then
            echo "committed conflict markers" >&2
            exit 1
          fi

      - name: Build release compiler
        run: cargo build --release --bin brievc

      - name: Effect-shape guard (quick)
        run: bash benchmarks/effect_shape_guard.sh --quick

      - name: Library tests
        # nextest runs test binaries concurrently (cargo test serializes them);
        # -j 4 keeps clang/brievc-spawning tests from starving each other.
        run: cargo nextest run --lib -j 4

      - name: Target support table
        run: ./target/release/brievc targets

      - name: Tier-2 compile-only IR
        run: |
          ./target/release/brievc build tests/fixtures/minimal.bv --llvm --triple aarch64-unknown-linux-gnu --out /tmp/tier2-aarch64
          ./target/release/brievc build tests/fixtures/minimal.bv --llvm --triple riscv64-unknown-none --out /tmp/tier2-riscv64

      - name: Unsupported target fails cleanly
        run: |
          if ./target/release/brievc build tests/fixtures/minimal.bv --triple definitely-not-a-target --out /tmp/tier2-unsupported; then
            echo "unsupported target unexpectedly succeeded" >&2
            exit 1
          fi

      - name: All-target tests
        run: cargo nextest run --all -j 4

      - name: Preserve deterministic simulation counterexample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-transition-failure
          path: target/simulation-failure/
          if-no-files-found: ignore

      - name: Quarantined tests (non-blocking)
        continue-on-error: true
        run: timeout 600s cargo test --all -- --ignored --test-threads=1

      - name: Binary tests
        run: cargo test --bin brievc

      - name: Tier-1 end-to-end fixtures
        run: cargo test --test daily_use_smoke

      - name: Accel reactor non-hang gate
        run: bash benchmarks/accel_reactor_nonhang.sh

      - name: Browser heap and collection snapshot gates
        run: |
          node tests/web_host_transport.mjs
          node tests/web_heap.mjs
          ./target/release/brievc build tests/fixtures/collection_snapshot.rbv --split --out /tmp/collection_snapshot
          node tests/web_collection_snapshot.mjs /tmp/collection_snapshot/collection_snapshot.wasm

      - name: Contract census (deny)
        run: bash scripts/contract_census.sh /tmp/contract_census.log

      - name: IR determinism (quick)
        run: bash benchmarks/ll_determinism_check.sh --quick

      - name: Parity corpora
        run: bash benchmarks/parity/run.sh cast_cases float_cases float_fmt_cases int_cases parse_cases string_cases
