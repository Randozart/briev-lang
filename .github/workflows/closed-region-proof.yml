name: Closed region ownership proof

on:
  push:
    branches: [fix/closed-region-ownership]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closed-region-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm lld spirv-tools valgrind
          mkdir -p /tmp/opencode
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Library and ownership regressions
        run: cargo test --lib --test reclamation_runtime -- --test-threads=2
      - name: Full integration gate after upstream reconciliation
        run: bash scripts/gate.sh full
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Check ownership invariant with bounded resources
        shell: bash
        run: |
          mkdir -p proof-results
          git rev-parse HEAD > proof-results/commit.txt
          cargo kani --version > proof-results/version.txt
          # 2026-11-11: the whole-graph proof exhausted the developer machine.
          # Bound resident memory and wall time; exhaustion must fail, never pass.
          # Keep these limits even if a smaller equivalent proof replaces it.
          # RLIMIT_AS rejected compiler address mappings before proof checking.
          # A cgroup bounds actual memory across the entire process tree instead.
          set +e
          sudo systemd-run --wait --pipe --collect --service-type=exec \
            --property="User=$(id -un)" --property="WorkingDirectory=$PWD" \
            --property=MemoryMax=5G --property=MemorySwapMax=0 \
            /usr/bin/env "HOME=$HOME" "PATH=$PATH" CARGO_BUILD_JOBS=1 \
            CARGO_PROFILE_DEV_DEBUG=0 \
            timeout --signal=TERM --kill-after=30s 35m \
            cargo kani --lib --features kani,kani_full \
              --harness external_storage_publication_remains_boundary_reachable \
              > proof-results/kani.log 2>&1
          status=$?
          printf '%s\n' "$status" > proof-results/exit-code.txt
          tail -80 proof-results/kani.log
          exit "$status"
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-region-proof-${{ github.sha }}
          path: proof-results/
          retention-days: 14
