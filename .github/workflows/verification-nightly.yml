name: Verification nightly

# 2026-11-09 (verification program P3): the full differential matrix that is
# too slow for the 45-minute PR gate. PR-time CI keeps the quick subset; this
# workflow runs every program-surface tier1 fixture at -O0/-O2/-O3 (the top arm
# uses the harness -O3 -flto pipeline) and compares stdout/exit against -O0.
#
# Queued for later nightly expansion (harnesses not yet written):
#   - interpreter-over-corpus differential (the generated-transition harness
#     from PR #80 covers generated families only)
#   - wasm32 cross-backend corpus gate
# Both are tracked in docs/plans/2026-11-09-compiler-verification-program.md.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  ast-optout-suite:
    name: AST opt-out suite (BRIEV_HIR_EMIT=0)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM + clang + Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm build-essential z3
          z3 --version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
      # 2026-11-18: several `#[cfg(test)]` PTX dump tests write debug artifacts
      # to a hardcoded `/tmp/opencode/…` and `unwrap()` the write (45 references,
      # e.g. src/backend/ptx/tensor.rs). CI normally gets that directory from
      # `.github/actions/compiler-tools`, which this job never invokes — so those
      # tests panicked with "No such file or directory" (the 2026-11-15 red:
      # `backend::ptx::tensor::r16_dump::*`). Create it here rather than teaching
      # 45 test sites to tolerate a missing debug path.
      - name: Create the test artifact directory
        run: mkdir -p /tmp/opencode
      # The flipped default is HIR; this keeps the one-release opt-out path
      # honest without doubling every PR gate.
      # 2026-11-15: two tests are HIR-specific and must be excluded:
      #   - `analysis_carries_hir`: calls `hir::verify()` and `lower_program()`
      #   - `router_smoke_gate`: tests HIR-path codegen via the `brievc` subprocess
      # Both fail under BRIEV_HIR_EMIT=0; the PR gate covers them with HIR on.
      #
      # 2026-11-18: the exclusion below was written as `-E 'not testname:NAME'`
      # twice. Neither half is valid: nextest's predicates are `test(…)`/
      # `package(…)`/… with matchers `=str`, `~str`, `/re/` (see
      # `cargo nextest help filterset`), and `-E` takes ONE expression — two
      # flags mean the second silently replaces the first. The job died with
      # "error: failed to parse filterset" (exit 94) before running a single
      # test, so the AST path went unobserved from 2026-11-16 until this fix.
      #
      # Direction matters here: an unparseable filterset fails loudly, but a
      # *parseable* one that silently drops a flag would hide a real failure.
      # The expression below keeps both exclusions in one filterset, so neither
      # can be lost.
      - name: Full suite on the AST path
        env:
          BRIEV_HIR_EMIT: "0"
        run: |
          cargo nextest run --all -j 4 \
            -E 'not (test(=analysis_carries_hir) or test(=router_smoke_gate))'

  full-opt-matrix:
    name: Full tier1 optimization matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM + clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm build-essential

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Full optimization-level differential
        env:
          OPT_MATRIX_FULL: "1"
        run: cargo test --release --test opt_level_parity -- --nocapture
