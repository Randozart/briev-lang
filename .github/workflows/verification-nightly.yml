name: Verification nightly

# 2026-11-09 (verification program P3): the full differential matrix that is
# too slow for the 45-minute PR gate. PR-time CI keeps the quick subset; this
# workflow runs every program-surface tier1 fixture at -O0/-O2/-O3 (the top arm
# uses the harness -O3 -flto pipeline) and compares stdout/exit against -O0.
#
# Queued for later nightly expansion (harnesses not yet written):
#   - interpreter-over-corpus differential (the generated-transition harness
#     from PR #80 covers generated families only)
#   - wasm32 cross-backend corpus gate
# Both are tracked in docs/plans/2026-11-09-compiler-verification-program.md.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  ast-optout-suite:
    name: AST opt-out suite (BRIEV_HIR_EMIT=0)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM + clang + Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm build-essential z3
          z3 --version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
      # The flipped default is HIR; this keeps the one-release opt-out path
      # honest without doubling every PR gate.
      - name: Full suite on the AST path
        env:
          BRIEV_HIR_EMIT: "0"
        run: cargo nextest run --all -j 4

  full-opt-matrix:
    name: Full tier1 optimization matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM + clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm build-essential

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Full optimization-level differential
        env:
          OPT_MATRIX_FULL: "1"
        run: cargo test --release --test opt_level_parity -- --nocapture
