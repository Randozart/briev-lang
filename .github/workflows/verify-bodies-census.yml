# Non-blocking --verify-bodies census on the .bv corpus.
# Runs on every push/PR to main, produces a JSON artifact.
# Fails CI only if any contract is VIOLATED (false proof).
name: Verify Bodies Census

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-bodies:
    name: --verify-bodies census
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm z3 build-essential

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build brievc
        run: cargo build --release --bin brievc

      - name: Build counsel-check
        run: cargo install counsel --quiet --no-default-features --features static

      # --- Census over a bounded, fast corpus ---
      #
      # The full tree is 650+ files and includes benchmarks that take minutes
      # each to codegen; running them all exceeded the job timeout. The signal
      # we need is "no contract became violated", so the corpus is the stdlib
      # surface that carries the contracts plus the smoke programs that pull
      # them in. Widen it deliberately once per-file cost is understood.
      - name: Generate file list
        run: |
          {
            find lib/std -maxdepth 1 -name "*.bv"
            find .smoke -name "*.bv"
          } | sort > /tmp/bv_corpus.txt
          echo "Corpus: $(wc -l < /tmp/bv_corpus.txt) files"

      - name: Run verify-bodies census
        # Per-file wall-clock bound. Without it a single pathological file
        # starved the hosted runner (the job died at ~55 min with "the hosted
        # runner lost communication"), so the census produced no signal at all.
        # A slow file is now recorded as `timed_out` in the report instead.
        env:
          VERIFY_BODIES_TIMEOUT: "120"
        run: |
          export BRIEVC=./target/release/brievc
          bash scripts/verify-bodies-census.sh /tmp/bv_corpus.txt /tmp/verify-bodies-report.json

      - name: Upload census artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-bodies-report
          path: /tmp/verify-bodies-report.json
          retention-days: 14

      - name: Print summary
        if: always()
        run: |
          python3 -c "
          import json
          d = json.load(open('/tmp/verify-bodies-report.json'))
          s = d['summary']
          print(f'Corpus: {d[\"total_files\"]} files')
          print(f'Proven:   {s[\"proven\"]}')
          print(f'Unproven: {s[\"unproven\"]}')
          print(f'Skipped:  {s[\"skipped\"]}')
          print(f'Violated: {s[\"violated\"]}')
          print(f'Errors:   {s[\"errors\"]}')
          if s.get('timed_out', 0):
              print(f'Timed out: {s[\"timed_out\"]} — per-file bound hit; widen VERIFY_BODIES_TIMEOUT or investigate')
          if s['violated'] > 0:
              print('ERROR: Violated contracts found — false proofs!')
              exit(1)
          "
