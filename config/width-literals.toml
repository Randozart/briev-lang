# ===----------------------------------------------------------------------=== #
# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# ===----------------------------------------------------------------------=== #
# Declared per-file budgets for hardcoded `i64` in the LLVM backend — the literal
# that means "I guessed the target word width".
#
# RULE: a count may only DECREASE. `cargo test --test width_literal_ratchet` fails
# when a file's count goes UP (naming the file and the delta, so the failure lands
# on the change that caused it) and also when it goes DOWN without this file being
# updated (a stale record is a lie, and people plan against it).
#
# Why a budget and not a ban: a large share of these occurrences are LEGITIMATE.
# The C runtime's ABI is fixed-width on every triple (`long long` is 64 bits even
# where the pointer is 32) and `Bit<64>` values are genuinely 64-bit. A blanket ban
# cannot tell those from `store i64 %v` where `%v` IS the target word; a counted
# budget can, because it only asks whether the situation got worse.
#
# Only `i64` is counted. `i32` is deliberately excluded: it is frequently the
# correct width for a genuine 32-bit value (a Char, a `Bit<32>` field), so counting
# it would add noise without measuring the thing that breaks 32-bit targets.
#
# Excluded from the count, and why:
#   * comment lines — a rationale naming `i64` is documentation, not emission;
#   * `#[cfg(test)]` files (`tests.rs`, `*_tests.rs`, `crash_regressions.rs`) —
#     they assert emitted text, so they must contain what they assert;
#   * lines calling a runtime symbol (`briev_`, `__briev`) — fixed-width C ABI;
#   * lines mentioning `double`/`f64` — an IEEE image is 64 bits by definition.
#
# 2026-11-25 (S2): ONE intended increase, and it is reviewed. `inttoptr_word` needs a
# fallback for a handle whose width was never recorded; the fallback is the documented
# boxed-handle default `i64`, and it now lives in `FunctionContext::handle_int_ty`
# (context.rs +1) instead of at an emission site. This is the only place a raise is
# allowed and it is written down here so the next reader does not have to guess
# whether it was an accident.
#
# 2026-11-25 (stage C, second pass): emit_toplevel 281 -> 287 — the six
# new i64 spellings are the harvest-era marshal arm and the record calls in
# the ExtCall/finish_user_call fixes (each records or converts a width the
# old code guessed). Reviewed, intentional.
# Measured 2026-11-25 at main e2b0a2c9b (P0-P2a landed, before P2b's remaining
# slice). The wasm32 IR debt at that commit is 12 invalid programs of 114; the
# larger counts here are the tail that no corpus program has reached yet.
#
# To lower a number: remove the literal (ask `operand_width`, `ctx.int_bits`, or
# the casting graph), then set the measured value. Never raise one.

