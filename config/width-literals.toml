"builder.rs" = 14
"coll_scaffold.rs" = 7
"collection_assignment.rs" = 10
"context.rs" = 8
"dispatch.rs" = 16
"emit_expr.rs" = 463
"emit_hir_stmt.rs" = 5
"emit_stmt.rs" = 92
"emit_toplevel.rs" = 281
