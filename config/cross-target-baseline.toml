# Declared cross-target invalid-IR baselines for `scripts/cross_target_ir.sh`.
#
# RULE: a count may only DECREASE. This file is the honest record of how much
# debt is left, and `cargo test --test cross_target_baseline` fails when reality
# is BETTER than the record, so the number cannot quietly drift out of date.
#
# A triple absent from this table has an implicit baseline of 0.
#
# 2026-11-25 (wasm32 supported-target plan, P0) — why wasm32 is not 0 yet:
#   wasm32 is a SHIPPED target (the `.rbv` web build), so the corpus includes
#   every `*.rbv` program, and this count covers the whole surface:
#     * `.rbv` (the web path), 29 programs: 0 invalid-IR failures. Latent.
#     * `.bv`  (compiler feature corpus), 100 programs: the debt below.
#
#   The count is INVALID IR only. A program the compiler REFUSES for the target
#   (it cannot prove the program terminates there — "walked the live program ... no
#   endprogram, halt, or trap is reachable" — or a device-strategy probe misses)
#   is reported separately and is NOT counted here: nothing is emitted, so no
#   invalid module is claimed. On 2026-11-25 that distinction was worth more than
#   half the number: 27 was reported before it, and 15 of those were refusals.
#
#   Cause of the 12, measured: 103 hardcoded `inttoptr i64` sites in
#   src/backend/llvm/ against 65 places that already ask `ctx.int_bits`; a
#   representation channel keyed by register name that outlives the namespace
#   keying it (14 counter restarts, 1 clear); and recorders that stamp a value's
#   CANONICAL width instead of the width it was emitted at. Plan P2 drives this to
#   0 by making the value answer for its own representation.
#
# Do NOT raise a number to make CI green. A regression is a regression: fix the
# emission, or record the bug in BUGS.md and say why the baseline must move.

[baseline]
"aarch64-unknown-linux-gnu" = 0
"wasm32-unknown-wasi" = 12
