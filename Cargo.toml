[package]
name = "briev-compiler"
version = "0.1.0"
edition = "2024"

[lib]
name = "briev_compiler"
path = "src/lib.rs"
crate-type = ["lib", "staticlib"]

[features]
kani = []

kani_full = []

[[bin]]
name = "brievc"
path = "src/main.rs"

[dependencies]
logos = "0.13"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
notify = "6.1"
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
lsp-server = "0.7"
lsp-types = "0.93"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
open = "5"
dirs = "5"
tokio = { version = "1.51.1", features = ["full"] }
wasm-bindgen = "0.2.117"
js-sys = "0.3.94"
regex = "1.12.3"
libloading = "0.8"
zip = "0.6"
md-5 = "0.10"
sha-1 = "0.10"
sha2 = "0.10"
bincode = "1.3"
flate2 = "1.0"
uuid = { version = "1.0", features = ["v4"] }
ureq = "2.12"
rspirv = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"
goblin = "0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("kani", "nightly"))'] }
