[package]
name = "briev-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
briev-compiler = { path = "..", features = ["fuzzing"] }

[workspace]
members = ["."]

[[bin]]
name = "frontend"
path = "fuzz_targets/frontend.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arithmetic"
path = "fuzz_targets/arithmetic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interpreter"
path = "fuzz_targets/interpreter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typecheck"
path = "fuzz_targets/typecheck.rs"
test = false
doc = false
bench = false

[[bin]]
name = "welltyped"
path = "fuzz_targets/welltyped.rs"
test = false
doc = false
bench = false
